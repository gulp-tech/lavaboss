      mode: RANDOM_RADIUS
      world: world

      fixed:
        x: 0.5
        y: 70.0
        z: 0.5
        yaw: 0.0
        pitch: 0.0

      random:
        center-x: 0
        center-z: 0
        minimum-radius: 100
        maximum-radius: 1000
        attempts: 50

      auto:
        enabled: false
        minimum-delay-seconds: 1800
        maximum-delay-seconds: 3600
        maximum-alive: 1

    announcement:
      enabled: true

      chat:
        enabled: true
        text: "<#FF5500>{boss} <white>появился!"

      title:
        enabled: true
        title: "<#FF3300><bold>БОСС ПОЯВИЛСЯ</bold>"
